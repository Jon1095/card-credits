<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Credits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Credits">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell — sticky title bar, one scrolling view, fixed bottom tab bar; centered 480px column on desktop */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#eceef2; --line:#dde1e7;
  --fg:#16191f; --fg2:#4d5562; --fg3:#7a8290;
  --ink:#1d2533;            /* UI accent: ink, so the three card colors carry all the hue */
  --csr:#2f5aa8; --gold:#b07d1e; --bilt:#008f84;
  --good:#1f7a45; --good-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fbefd9;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181d; --surface:#1d2128; --sunk:#252a33; --line:#2f3540;
  --fg:#eef0f4; --fg2:#b3b9c4; --fg3:#858d9a; --ink:#e4e8ef;
  --csr:#5584d4; --gold:#bb8a2a; --bilt:#22a199;
  --good:#5cc489; --good-bg:#1c3326; --warn:#e6a447; --warn-bg:#3a2d17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1d2128; --sunk:#252a33; --line:#2f3540;
  --fg:#eef0f4; --fg2:#b3b9c4; --fg3:#858d9a; --ink:#e4e8ef;
  --csr:#5584d4; --gold:#bb8a2a; --bilt:#22a199;
  --good:#5cc489; --good-bg:#1c3326; --warn:#e6a447; --warn-bg:#3a2d17;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}
/* home-screen app runs under the status bar (black-translucent); this strip keeps it on the page background */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.view{display:flex;flex-direction:column;gap:18px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--fg3)}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* card art */
.cardimg{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:1.586;object-fit:cover;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px -12px rgba(0,0,0,.35)}
.cardart{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px -12px rgba(0,0,0,.35)}
.cardart::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none}
.cardart.csr{background:radial-gradient(120% 90% at 85% 10%,#3a5f9e 0%,#1b2f55 45%,#0e1a33 100%)}
.cardart.gold{background:linear-gradient(135deg,#e9c97a 0%,#c99a3e 40%,#a77a25 70%,#d8b25f 100%);color:#2a1d05}
.cardart.bilt{background:linear-gradient(135deg,#f2f4f6 0%,#b7bec6 28%,#eef1f4 52%,#9aa3ad 78%,#dfe3e8 100%);color:#161a20}
.cardart .issuer{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.cardart .cname{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.cardart .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#efd9a0,#b8944b);opacity:.9}
.cardart .net{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.cardart .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cardlist{display:flex;flex-direction:column;gap:14px}
.cardtile{display:flex;flex-direction:column;gap:8px;text-align:left}
.cardtile .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--fg2);padding-inline:4px}
.cardtile .meta b{color:var(--fg);font-weight:600}
/* generic panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 6px}
.ptitle h2,.ptitle h3{margin:0;font-size:15px;font-weight:600}
.ptitle .sub{font-size:13px;color:var(--fg3);text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--fg2)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--fg3)}
.stat .v{font-size:18px;font-weight:500}
/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.erow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px 16px}
.erow .x{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1}
.erow .d{font-size:14px;min-width:0}
.erow .d small{display:block;color:var(--fg3);font-size:12.5px}
.crow{display:flex;align-items:center;gap:8px;padding:10px 16px}
.crow .d{flex:1;min-width:0}
.crow .d .n{font-size:14.5px}
.crow .d small{display:block;color:var(--fg3);font-size:12.5px}
.crow .amt{font-size:14px;color:var(--fg2)}
.crow.off .d,.crow.off .amt{opacity:.45}
.perk{padding:10px 16px;font-size:14px}
.perk.muted{color:var(--fg3)}
.ibtn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--fg3)}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.ibtn .dotfill{fill:currentColor;stroke:currentColor}
.ibtn:hover{color:var(--fg)}
.how p{margin:0}
.how ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.perk small{display:block;color:var(--fg3);font-size:12.5px}
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;font-size:14px}
.field small{display:block;color:var(--fg3);font-size:12.5px}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
/* tracker */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar .m{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:18px}
.iconbtn:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.trow{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 8px}
.check{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%}
.check .ring{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .12s,border-color .12s}
.check .ring svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.trow.done .check .ring{background:var(--c);border-color:var(--c)}
.trow.done .check .ring svg{opacity:1}
.trow.part .check .ring{border-color:var(--c);background:conic-gradient(var(--c) var(--p),transparent 0)}
.trow .body{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px;padding-block:4px}
.trow .body .t{flex:1;min-width:0}
.trow .body .n{font-size:14.5px;line-height:1.3}
.trow.done .body .n{color:var(--fg2)}
.trow .body small{display:block;font-size:12.5px;color:var(--fg3)}
.trow .body small.soon{color:var(--warn);font-weight:600}
.trow .a{font-size:14px;text-align:right;white-space:nowrap}
.trow .a .of{color:var(--fg3)}
.prog{height:4px;border-radius:2px;background:var(--sunk);margin:2px 16px 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:2px}
.empty{padding:14px 16px;color:var(--fg3);font-size:14px}
/* guide */
.note{font-size:13.5px;color:var(--fg2);max-width:62ch}
.grow{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.grow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.grow .cat{font-weight:600;font-size:15px}
.grow .cat small{display:block;font-weight:400;color:var(--fg3);font-size:12.5px}
.winner{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));font-size:13px;font-weight:600;white-space:nowrap}
.winner .x{font-family:var(--font-num)}
.rates{display:flex;gap:6px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);background:var(--sunk);border-radius:6px;padding:3px 8px}
.rate.best{color:var(--fg);font-weight:600}
.rate.na{color:var(--fg3)}
.tip{font-size:12.5px;color:var(--fg2)}
.search{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
/* value */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .big{font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1.05}
.hero .vs{color:var(--fg2);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.vcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;text-align:left;width:100%}
.vcard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vcard .name{display:flex;align-items:center;gap:8px;font-weight:600}
.vbar{position:relative;height:12px;border-radius:6px;background:var(--sunk)}
.vbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c)}
.vbar .fee{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:1px}
.vline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg2)}
.vline b{color:var(--fg);font-weight:500}
.breakdown{border-top:1px solid var(--line);padding:6px 0}
.brow{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;font-size:13.5px}
.brow .of{color:var(--fg3)}
.brow.zero .l{color:var(--fg3)}
.chart{padding:8px 10px 12px}
.bars{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:160px;align-items:end;border-bottom:1px solid var(--line)}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.gridline span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--fg3);background:var(--surface);padding-left:4px}
.bar{position:relative;height:100%;display:flex;flex-direction:column-reverse;gap:2px;cursor:pointer;justify-content:flex-start}
.bar i{display:block;background:var(--c);width:100%}
.bar i:last-child{border-radius:4px 4px 0 0}
.bar.future{cursor:default}
.mlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:6px;font-size:10.5px;letter-spacing:-.01em;white-space:nowrap;color:var(--fg3);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);padding:0 16px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tooltip{margin:4px 16px 12px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;min-height:42px}
.tooltip .tl{display:flex;justify-content:space-between;gap:8px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;overscroll-behavior:contain;touch-action:none;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{touch-action:pan-y;overscroll-behavior:contain;width:100%;max-width:480px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet .how{font-size:14px;color:var(--fg2);background:var(--sunk);border-radius:10px;padding:10px 12px}
.amtin{display:flex;align-items:center;gap:8px;font-size:15px}
.amtin input{width:110px;font-family:var(--font-num);font-size:18px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500}
/* sync status and save errors */
.hr{display:flex;align-items:center;gap:10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg3);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--good)}
.sync.wait{color:var(--warn)}
.alert{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:29;display:flex;align-items:flex-start;gap:10px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
.alert p{margin:0;flex:1}
.alert button{font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
/* sign-in */
.signin{display:flex;flex-direction:column;gap:12px;padding:16px}
.signin label{font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:-6px}
.err{color:var(--warn);font-size:13.5px;margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top"><h1 id="title">Tracker</h1><div class="hr"><span class="eyebrow" id="topright"></span><span class="sync" id="sync" role="status" hidden></span></div></header>
  <main id="view" class="view"></main>
</div>

<nav class="tabs" aria-label="Sections" hidden><div class="inner">
  <button type="button" data-tab="cards"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Cards</button>
  <button type="button" data-tab="tracker"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M5 7l.8.8L7.3 6.3M11 7h9M11 17h9M11 12h9"/></svg>Tracker</button>
  <button type="button" data-tab="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Best card</button>
  <button type="button" data-tab="value"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 20h14M4 9l3-5 3 5a3 3 0 0 1-6 0zM14 9l3-5 3 5a3 3 0 0 1-6 0zM7 4h10"/></svg>Value</button>
</div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="alert" id="alert" role="alert" hidden><p id="alert-msg"></p><button type="button" id="alert-x">Dismiss</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module">
/* ---------- firebase ---------- */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, onSnapshot, setDoc, updateDoc, writeBatch,
  deleteField, FieldPath, serverTimestamp, terminate, clearIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyBzbzpEuzzHFLi5aWoHkwWoUebtF7b4Paw",
  authDomain: "card-credits.firebaseapp.com",
  projectId: "card-credits",
  storageBucket: "card-credits.firebasestorage.app",
  messagingSenderId: "491510342284",
  appId: "1:491510342284:web:119eda36bd93ec4711d1a9"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);

/* ---------- state ----------
   Everything lives in one Firestore doc, users/{uid}. Each check-off in S.log keeps its own dollar
   amount (amt), the credit's full amount for that period (face) and its card, so editing CREDITS
   later never rewrites history. Annual fees are stored per card per year in S.fees. */
const DATA_KEYS = ['off','anniv','rent','biltRate','fees','log'];
let S = null, USER = null, userRef = null, unsub = null, snapTaken = false;
const DEL = 'delete';   // pass as a value to save() to remove the field
function blank(){ return {log:{}, off:{'csr-peloton':true}, anniv:{csr:5,bilt:null}, rent:1811, biltRate:0.5,
  fees:Object.fromEntries(CARDS.map(c=>[c.id,{...c.fee}]))}; }
const pick = s => Object.fromEntries(DATA_KEYS.map(k=>[k,s[k]]));
// Callers change S first, then save the one field they touched (path null replaces the whole doc).
// Offline, the write is queued and syncs later.
function save(path, value){
  const op={id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`, path, ...(value===DEL?{del:true}:{value})};
  // a newer change to the same field supersedes the older one; replacing the doc supersedes everything
  outbox = path ? outbox.filter(o=>o.path && o.path.join('\u0000')!==path.join('\u0000')) : [];
  outbox.push(op); storeOutbox(); send(op);
}

/* ---------- outbox ----------
   Every change is also kept in localStorage until the server confirms it, and replayed on every start.
   Firestore's own offline queue normally covers this, but when the SDK is torn down mid-session
   (see "page lifecycle" below) its unsent work is dropped. With the outbox, nothing is lost. */
let outbox = [];
const outboxKey = () => `card-credits-outbox-${USER.uid}`;
function loadOutbox(){ try{ outbox = JSON.parse(localStorage.getItem(outboxKey())) || []; }catch(e){ outbox = []; } }
function storeOutbox(){ try{ localStorage.setItem(outboxKey(), JSON.stringify(outbox)); }catch(e){} updateSync(); }
function send(op){
  const w = op.path ? updateDoc(userRef, new FieldPath(...op.path), op.del ? deleteField() : op.value) : setDoc(userRef, op.value);
  w.then(()=>{ outbox = outbox.filter(o=>o.id!==op.id); storeOutbox(); })   // resolves once the server has it
   .catch(err=>{ console.error(err); showError(`Couldn’t save a change (${err.code||err.message}). It’s kept on this device and will be sent again the next time the app opens.`); });
}
function applyOp(op){
  if(!op.path){ S = Object.assign(blank(), op.value); return; }
  let o=S; for(const k of op.path.slice(0,-1)) o = (o[k] && typeof o[k]==='object') ? o[k] : (o[k]={});
  if(op.del) delete o[op.path.at(-1)]; else o[op.path.at(-1)] = op.value;
}

/* ---------- sync status ---------- */
const sync = { pending:false, fromCache:true };
function updateSync(){
  const el=document.getElementById('sync');
  if(!USER || !S){ el.hidden=true; return; }
  const waiting = outbox.length>0 || sync.pending, online = navigator.onLine!==false;
  el.hidden=false;
  el.className = 'sync ' + (waiting ? 'wait' : sync.fromCache ? '' : 'ok');
  el.textContent = waiting ? (online ? 'Waiting to sync' : 'Offline · waiting to sync') : sync.fromCache ? (online ? 'Connecting…' : 'Offline') : 'Saved';
}
addEventListener('online', ()=>updateSync()); addEventListener('offline', ()=>updateSync());

/* ---------- date helpers ---------- */
const NOW = new Date();
const pad = n=>String(n).padStart(2,'0');
const ymStr=(y,m)=>`${y}-${pad(m)}`;
const today = {y:NOW.getFullYear(), m:NOW.getMonth()+1};
const fmt = n => '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2, maximumFractionDigits:2});

function amtAt(c, y, m){
  if(!c.amts) return c.amt;
  const k=ymStr(y,m); let a=c.amts[0].amt;
  for(const h of c.amts){ if(h.from<=k) a=h.amt; }
  return a;
}
function activeAt(c,y,m){
  const k=ymStr(y,m);
  if(c.start && k<c.start) return false;
  if(c.end && k>c.end) return false;
  return true;
}
function annivMonth(c){ return (c.resetOn==='anniv' && CARD[c.card].anniv) ? S.anniv[c.card] : null; }
function periodKey(c,y,m){
  if(c.freq==='month') return ymStr(y,m);
  if(c.freq==='half') return `${y}-H${m<=6?1:2}`;
  const a=annivMonth(c);
  if(a){ const sy = m>=a ? y : y-1; return `CY${sy}-${pad(a)}`; }
  return String(y);
}
function periodEnd(c,y,m){ // date the credit resets (first day of next period)
  if(c.freq==='month') return new Date(y, m, 1);
  if(c.freq==='half') return m<=6 ? new Date(y,6,1) : new Date(y+1,0,1);
  const a=annivMonth(c);
  if(a){ const sy = m>=a ? y : y-1; return new Date(sy+1, a-1, 1); }
  return new Date(y+1,0,1);
}
const fmtDate = d => `${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear()!==today.y?', '+d.getFullYear():''}`;
const entry = (c,y,m) => S.log[`${c.id}|${periodKey(c,y,m)}`];
const isOn = c => !S.off[c.id];

/* ---------- value math ---------- */
const creditOf = id => CREDITS.find(x=>x.id===id);
const worth = (c, amt) => c?.cash ? amt*(S.biltRate ?? 0.5) : amt;
const mkEntry = (c, amt, face, ym) => ({amt, face, card:c.card, ym});
function usedInYear(cardId, Y){
  let t=0; for(const [k,e] of Object.entries(S.log)){ if(e.card===cardId&&e.ym.startsWith(Y+'-')) t+=worth(creditOf(k.split('|')[0]),e.amt); } return t;
}
function usedByCredit(c, Y){
  let t=0; for(const [k,e] of Object.entries(S.log)){ if(k.split('|')[0]===c.id && e.ym.startsWith(Y+'-')) t+=worth(c,e.amt); } return t;
}
function possibleByCredit(c, Y){
  if(!isOn(c)) return 0;
  if(c.freq==='month'){ let t=0; for(let m=1;m<=12;m++) if(activeAt(c,Y,m)) t+=amtAt(c,Y,m); return t; }
  if(c.freq==='half'){ let t=0; if(activeAt(c,Y,1)) t+=amtAt(c,Y,1); if(activeAt(c,Y,7)) t+=amtAt(c,Y,7); return t; }
  return activeAt(c,Y,12)||activeAt(c,Y,1) ? worth(c,amtAt(c,Y,12)) : 0;
}
function annualValue(cardId){ return CREDITS.filter(c=>c.card===cardId).reduce((t,c)=>t+possibleByCredit(c,today.y),0); }
// Fee on file for year Y, else the closest earlier year, else the earliest year on file
function feeFor(card,Y){
  const f=S.fees[card.id]||card.fee, ys=Object.keys(f).map(Number).sort((a,b)=>a-b);
  if(f[Y]!=null) return f[Y];
  const prior=ys.filter(y=>y<Y); return f[prior.length?prior.at(-1):ys[0]];
}

function creditSub(x){

function trow(c,y,m){

  return `<li><div class="trow ${done?'done':''} ${part?'part':''}" style="--c:${colorVar(c.card)};--p:${part?Math.round(e.amt/a*100):0}%">

    </button>

}

/* ---------- pop-up scroll lock ----------
   While a sheet is open the page behind it is pinned in place (body fixed at the current
   scroll offset), so swipes can only scroll the sheet. Closing restores the exact position. */
const scrim=document.getElementById('scrim');
let lockedY=0, opener=null;
function showModal(){
  if(scrim.hidden){
    opener=document.activeElement;
    lockedY=window.scrollY;
    document.body.style.top=`-${lockedY}px`;
    document.body.classList.add('locked');
  }
  scrim.hidden=false;
  const f=scrim.querySelector('.sheet'); if(f){ f.setAttribute('tabindex','-1'); f.focus({preventScroll:true}); }
}
function hideModal(){
  scrim.hidden=true; scrim.innerHTML='';
  document.body.classList.remove('locked'); document.body.style.top='';
  window.scrollTo(0,lockedY);
  if(opener && document.contains(opener)) opener.focus({preventScroll:true});
}
// iOS: block swipes on the dimmed backdrop, and stop a sheet that can't scroll further from dragging the page
scrim.addEventListener('touchmove',e=>{
  const sh=e.target.closest && e.target.closest('.sheet');
  if(!sh || sh.scrollHeight<=sh.clientHeight) e.preventDefault();
},{passive:false});

    <div style="display:flex;justify-content:center">${net>=0?`<span class="pill good">✓ Ahead by <span class="num">${fmt(net)}</span></span>`:`<span class="pill warn">▲ <span class="num">${fmt(-net)}</span> to break even</span>`}</div>
    <section class="panel">
      <div class="ptitle"><h2>By card</h2><span class="sub">Tap for each credit</span></div>
      <div class="ptitle" style="padding-top:0"><span class="sub" style="text-align:left">Bilt Cash counted at ${Math.round((S.biltRate??0.5)*100)}¢ per dollar. Change it on the Palladium card page.</span></div>
      <ul class="rows">${per.map(p=>{
        const scale=Math.max(p.fee,p.used,p.poss)||1, gap=p.used-p.fee, open=UI.open[p.c.id];
        const credits=CREDITS.filter(x=>x.card===p.c.id).map(x=>({x,u:usedByCredit(x,Y),p:possibleByCredit(x,Y)})).filter(r=>r.p>0||r.u>0).sort((a,b)=>b.u-a.u);
        return `<li><button class="vcard" type="button" data-vc="${p.c.id}" aria-expanded="${!!open}" style="--c:${colorVar(p.c.id)}">
          <div class="top"><span class="name"><span class="dot" style="background:${colorVar(p.c.id)}"></span>${esc(p.c.name)}</span>
            ${gap>=0?`<span class="pill good">✓ Ahead <span class="num">${fmt(gap)}</span></span>`:`<span class="pill warn">▲ <span class="num">${fmt(-gap)}</span> to go</span>`}</div>
          <div class="vbar" role="img" aria-label="${fmt(p.used)} used against a ${fmt(p.fee)} fee"><span class="fill" style="width:${Math.min(100,p.used/scale*100)}%"></span><span class="fee" style="left:calc(${p.fee/scale*100}% - 1px)"></span></div>
          <div class="vline"><span>Used <b class="num">${fmt(p.used)}</b></span><span>Fee <b class="num">${fmt(p.fee)}</b></span><span>Possible <b class="num">${fmt(p.poss)}</b></span></div>
        </button>
        ${open?`<div class="breakdown">${credits.map(r=>`<div class="brow ${r.u?'':'zero'}"><span class="l">${esc(r.x.name)}</span><span class="num">${fmt(r.u)}<span class="of"> / ${fmt(r.p)}</span></span></div>`).join('')}</div>`:''}
        </li>`; }).join('')}</ul>
    </section>
    <section class="panel">
      <div class="ptitle"><h2>By month</h2><span class="sub">Month each credit was used</span></div>
      <div class="legend">${CARDS.map(c=>`<span><span class="dot" style="background:${colorVar(c.id)}"></span>${esc(c.name)}</span>`).join('')}</div>
      <div class="chart">
        <div class="bars" id="bars">
          ${ticks.map(v=>`<div class="gridline" style="bottom:${v/ymax*100}%"><span class="num">$${v}</span></div>`).join('')}
          ${monthly.map((b,i)=>{ const future = Y===today.y && i+1>today.m; const segs=CARDS.map(c=>b[c.id]>0?`<i style="--c:${colorVar(c.id)};height:calc(${b[c.id]/ymax*100}% - 2px)"></i>`:'').join('');
            return `<button class="bar ${future?'future':''}" type="button" data-m="${i}" aria-label="${MONTHS_L[i]}: ${fmt(mtot[i])}">${segs}</button>`; }).join('')}
        </div>
        <div class="mlabels" aria-hidden="true">${MONTHS.map(m=>`<span>${m}</span>`).join('')}</div>
      </div>
      <div class="tooltip" id="tip">${tipHtml(UI.month ?? (Y===today.y?today.m-1:11), monthly, mtot)}</div>
    </section>`;
  document.getElementById('prevY').onclick=()=>{UI.vy--; UI.month=null; render();};
  document.getElementById('nextY').onclick=()=>{ if(UI.vy<today.y){UI.vy++; UI.month=null; render();} };
  view.querySelectorAll('[data-vc]').forEach(b=>b.addEventListener('click',()=>{ UI.open[b.dataset.vc]=!UI.open[b.dataset.vc]; render(); }));
  const tip=document.getElementById('tip');
  view.querySelectorAll('[data-m]').forEach(b=>{
    const show=()=>{ UI.month=Number(b.dataset.m); tip.innerHTML=tipHtml(UI.month,monthly,mtot); };
    b.addEventListener('mouseenter',show); b.addEventListener('focus',show); b.addEventListener('click',show);
  });
}
function tipHtml(i,monthly,mtot){
  const b=monthly[i];
  return `<div class="tl"><b>${MONTHS_L[i]}</b><b class="num">${fmt(mtot[i])}</b></div>` +
    CARDS.filter(c=>b[c.id]>0).map(c=>`<div class="tl"><span style="display:inline-flex;gap:6px;align-items:center"><span class="dot" style="background:${colorVar(c.id)}"></span>${esc(c.name)}</span><span class="num">${fmt(b[c.id])}</span></div>`).join('') +
    (mtot[i]===0?`<div style="color:var(--fg3)">Nothing logged.</div>`:'');
}

/* ---------- misc ---------- */
let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !scrim.hidden) hideModal(); });

function download(name, text, type){
  const url=URL.createObjectURL(new Blob([text],{type})), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
const isoDay = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;

/* ---------- backup: export / import ---------- */
function exportBackup(){
  const b={app:'card-credits', version:1, exportedAt:new Date().toISOString(), data:pick(S)};
  download(`card-credits-backup-${isoDay(new Date())}.json`, JSON.stringify(b,null,2), 'application/json');
  toast('Backup downloaded');
}
function parseBackup(text){
  const bad=()=>new Error('That file isn’t a Card Credits backup');
  let j; try{ j=JSON.parse(text); }catch(e){ throw bad(); }
  const d=j && j.app==='card-credits' && j.data;
  if(!d || typeof d.log!=='object' || !d.log) throw bad();
  const out=blank(), obj=v=>v && typeof v==='object' && !Array.isArray(v);
  if(obj(d.off)) out.off=Object.fromEntries(Object.keys(d.off).filter(k=>d.off[k]).map(k=>[k,true]));
  if(obj(d.anniv)) for(const c of CARDS.filter(c=>c.anniv)) if(c.id in d.anniv){ const v=d.anniv[c.id]; out.anniv[c.id]= v>=1&&v<=12 ? Number(v) : null; }
  if(d.rent>=0) out.rent=Number(d.rent);
  if(d.biltRate>0) out.biltRate=Number(d.biltRate);
  if(obj(d.fees)) for(const c of CARDS) if(obj(d.fees[c.id])) for(const [y,v] of Object.entries(d.fees[c.id])) if(/^\d{4}$/.test(y) && v>=0) out.fees[c.id][y]=Number(v);
  for(const [k,e] of Object.entries(d.log)){
    const card = e && (CARD[e.card] ? e.card : creditOf(k.split('|')[0])?.card);
    if(!card || !(e.amt>=0) || !/^\d{4}-\d{2}$/.test(e.ym)) throw new Error('The backup has a damaged check-off');
    out.log[k]={amt:Number(e.amt), face:Number(e.face ?? e.amt), card, ym:e.ym};
  }
  return {data:out, at:j.exportedAt ? new Date(j.exportedAt) : null};
}
document.getElementById('importFile').addEventListener('change', async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{ confirmImport(parseBackup(await f.text())); }catch(err){ toast(err.message); }
});
function confirmImport(b){
  const n=Object.keys(b.data.log).length, cur=Object.keys(S.log).length, missing=Object.keys(b.data.log).filter(k=>!(k in S.log));
  const when = b.at && !isNaN(b.at) ? ` from ${fmtDate(b.at)}${b.at.getFullYear()===today.y?', '+b.at.getFullYear():''}` : '';
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="im-t">
    <div class="grab"></div>
    <div><div class="eyebrow">Import backup</div><h3 id="im-t">Add or replace?</h3></div>
    <div class="how"><p>This backup${when} has ${n} check-off${n===1?'':'s'}, ${missing.length} of them not in the app now.</p>
      <ul><li><b>Add missing check-offs</b> keeps everything you have and adds ${missing.length===1?'the one that’s missing':`the ${missing.length} that are missing`}. Settings don’t change.</li>
      <li><b>Replace everything</b> swaps your ${cur} check-off${cur===1?'':'s'} and settings for the backup. A copy of your current data is saved first.</li></ul></div>
    <div class="btns"><button class="btn primary" type="button" id="im-add" ${missing.length?'':'disabled'}>Add missing check-offs</button></div>
    <div class="btns"><button class="btn" type="button" id="im-cancel">Cancel</button><button class="btn" type="button" id="im-go" style="flex:1">Replace everything</button></div>
  </div>`;
  showModal();
  document.getElementById('im-cancel').onclick=hideModal;
  scrim.onclick=ev=>{ if(ev.target===scrim) hideModal(); };
  document.getElementById('im-add').onclick=()=>{
    for(const k of missing){ S.log[k]=b.data.log[k]; save(['log',k], S.log[k]); }
    hideModal(); render(); toast(`Added ${missing.length} check-off${missing.length===1?'':'s'}`);
  };
  document.getElementById('im-go').onclick=()=>{
    const stamp=new Date().toISOString().slice(0,19).replace(/:/g,'-');
    setDoc(doc(userRef,'snapshots',`before-import-${stamp}`), {...pick(S), takenAt:serverTimestamp()})
      .catch(err=>{ console.error(err); showError(`Couldn’t save the copy of your data before importing (${err.code||err.message}).`); });
    const next={...b.data, ...(S.lastSnapshot?{lastSnapshot:S.lastSnapshot}:{})};
    S={...next}; save(null, next);
    hideModal(); render(); toast('Backup imported');
  };
}

/* ---------- monthly snapshot ----------
   The first time the app opens each month it copies the whole data doc to users/{uid}/snapshots/YYYY-MM. */
function monthlySnapshot(){
  const ym=ymStr(today.y,today.m);
  if(snapTaken || S.lastSnapshot===ym) return;
  snapTaken=true; S.lastSnapshot=ym;
  const batch=writeBatch(db);
  batch.set(doc(userRef,'snapshots',ym), {...pick(S), takenAt:serverTimestamp()});
  batch.update(userRef, {lastSnapshot:ym});
  batch.commit().catch(err=>{ console.error('Monthly snapshot failed', err); showError(`Couldn’t save this month’s automatic snapshot (${err.code||err.message}). It will try again next time.`); });
}
// Store this year's fee explicitly (carried over from the latest year on file), so changing it later never touches past years
function ensureFees(){
  for(const c of CARDS){
    const f = S.fees[c.id] ||= {};
    if(f[today.y]==null){ f[today.y]=feeFor(c,today.y); save(['fees',c.id,String(today.y)], f[today.y]); }
  }
}

/* ---------- calendar reminders (.ics) ---------- */
const icsText = t => t.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsFold(line){ // lines may be at most 75 bytes; continuations start with a space
  const enc=new TextEncoder(); let out='', n=0;
  for(const ch of line){ const b=enc.encode(ch).length; if(n+b>75){ out+='\r\n '; n=1; } out+=ch; n+=b; }
  return out;
}
function creditLine(c){
  const a=amtAt(c,today.y,today.m);
  return `• ${CARD[c.card].name}: ${c.name}, ${fmt(a)}${c.cash?' Bilt Cash':''}${c.end?` (through ${MONTHS[Number(c.end.slice(5))-1]} ${c.end.slice(0,4)})`:''}`;
}
function downloadCalendar(){
  const d=new Date(), stamp=d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z', url=location.href.split('#')[0];
  const live=CREDITS.filter(c=>isOn(c) && (!c.end || c.end>=ymStr(today.y,today.m)));
  const next25 = new Date(d.getFullYear(), d.getMonth() + (d.getDate()>25?1:0), 25);
  const nextHalf = d.getMonth()<5 ? new Date(d.getFullYear(),5,1) : d.getMonth()<11 ? new Date(d.getFullYear(),11,1) : new Date(d.getFullYear()+1,5,1);
  const event=(uid,start,rule,title,body)=>{
    const end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+1);
    return ['BEGIN:VEVENT',`UID:${uid}@card-credits`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${isoDay(start)}`,`DTEND;VALUE=DATE:${isoDay(end)}`,
      `RRULE:${rule}`,`SUMMARY:${icsText(title)}`,`DESCRIPTION:${icsText(body)}`,`URL:${url}`,'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsText(title)}`,'TRIGGER:PT9H','END:VALARM','END:VEVENT'];
  };
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Card Credits//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Card Credits',
    ...event('monthly-credits', next25, 'FREQ=MONTHLY;BYMONTHDAY=25', 'Use this month’s card credits',
      `Monthly credits reset on the 1st:\n${live.filter(c=>c.freq==='month').map(creditLine).join('\n')}\n\nCheck them off in Card Credits.`),
    ...event('half-year-credits', nextHalf, 'FREQ=YEARLY;BYMONTH=6,12;BYMONTHDAY=1', 'Six-month card credits reset soon',
      `These reset on July 1 and January 1:\n${live.filter(c=>c.freq==='half').map(creditLine).join('\n')}\n\nCheck them off in Card Credits.`),
    'END:VCALENDAR'];
  download('card-credits-reminders.ics', lines.map(icsFold).join('\r\n')+'\r\n', 'text/calendar');
  toast('Calendar file downloaded');
}

/* ---------- sign-in and sync ---------- */
const nav=document.querySelector('nav.tabs');
function showMessage(msg){ view.innerHTML=`<div class="panel"><div class="empty">${esc(msg)}</div></div>`; }
function showSignIn(){
  nav.hidden=true; document.getElementById('title').textContent='Card Credits'; document.getElementById('topright').textContent='';
  view.innerHTML=`<section class="panel"><form class="signin" id="signin">
    <p class="note" style="margin:0">Sign in to see your credits. After that, this device keeps a copy so the app works without signal.</p>
    <label for="si-email">Email</label><input class="search" id="si-email" type="email" autocomplete="username" required>
    <label for="si-pass">Password</label><input class="search" id="si-pass" type="password" autocomplete="current-password" required>
    <p class="err" id="si-err" hidden></p>
    <button class="btn primary" type="submit" id="si-go">Sign in</button>
  </form></section>`;
  const form=document.getElementById('signin'), err=document.getElementById('si-err'), go=document.getElementById('si-go');
  form.addEventListener('submit', async ev=>{
    ev.preventDefault(); err.hidden=true; go.disabled=true; go.textContent='Signing in…';
    try{ await signInWithEmailAndPassword(auth, document.getElementById('si-email').value.trim(), document.getElementById('si-pass').value); }
    catch(e){
      err.textContent = {'auth/invalid-credential':'That email and password don’t match.','auth/invalid-email':'That email address isn’t valid.',
        'auth/too-many-requests':'Too many tries. Wait a few minutes and try again.','auth/network-request-failed':'No connection. Signing in needs signal the first time.'}[e.code] || 'Couldn’t sign in. Try again.';
      err.hidden=false; go.disabled=false; go.textContent='Sign in';
    }
  });
}
// Re-render for changes from another device, but not while the user is typing in a field or has a sheet open
function refresh(){
  const a=document.activeElement;
  if(!scrim.hidden || (a && view.contains(a) && /^(INPUT|SELECT)$/.test(a.tagName))) return;
  render();
}
function subscribe(uid){
  userRef=doc(db,'users',uid); loadOutbox();
  let last='', stale=false;   // stale: data changed while our own writes were pending, re-render once they settle
  unsub=onSnapshot(userRef, {includeMetadataChanges:true}, snap=>{
    sync.pending=snap.metadata.hasPendingWrites; sync.fromCache=snap.metadata.fromCache;
    if(!snap.exists()){
      if(snap.metadata.fromCache) return;   // could be a new device that's offline; wait for the server before creating anything
      setDoc(userRef, blank()).catch(err=>{ console.error(err); showMessage('Couldn’t create your data. Check the Firestore rules in the README.'); });
      return;
    }
    const json=JSON.stringify(snap.data()), first=!S, changed=json!==last; last=json;
    if(changed || first){
      S=Object.assign(blank(), JSON.parse(json));
      outbox.forEach(applyOp);   // changes the server hasn't confirmed yet always show
    }
    if(first){
      outbox.forEach(send);      // replay anything left over from an earlier session
      ensureFees(); monthlySnapshot(); nav.hidden=false;
      restoreUi() || setTab(tabs.includes((location.hash||'').slice(1)) ? location.hash.slice(1) : 'tracker');
    } else {
      stale = stale || changed;
      if(stale && !snap.metadata.hasPendingWrites){ stale=false; refresh(); }
    }
    updateSync();
  }, err=>{ console.error(err); showMessage(err.code==='permission-denied' ? 'Firestore refused access. Check that the security rules have your user ID (see the README).' : 'Couldn’t load your data. Try again in a moment.'); });
}
async function doSignOut(){
  if(unsub){ unsub(); unsub=null; }
  await signOut(auth);
  try{ await terminate(db); await clearIndexedDbPersistence(db); }catch(e){} // remove this device's offline copy
  location.reload();
}
onAuthStateChanged(auth, user=>{
  if(unsub){ unsub(); unsub=null; }
  USER=user; S=null; snapTaken=false; hideModalIfOpen(); updateSync();
  if(!user){ showSignIn(); return; }
  nav.hidden=true; showMessage('Loading your credits…'); subscribe(user.uid);
});
function hideModalIfOpen(){ if(!scrim.hidden) hideModal(); }

/* ---------- page lifecycle ----------
   Firestore shuts itself down on 'pagehide', expecting the page to be going away. On iPhone it also
   takes the user agent's fixed "Mobile/15E148" for Safari 14-16 and stops running any further work.
   iOS home-screen apps can fire pagehide and later resume the same page, which leaves a dead Firestore
   that drops writes without an error. So after a pagehide, the next time the page is shown we reload it.
   The outbox and the saved screen position make the reload lossless. */
const UI_KEY='card-credits-ui';
let pageHidden=false;
addEventListener('pagehide', ()=>{
  pageHidden=true;
  try{ sessionStorage.setItem(UI_KEY, JSON.stringify({tab:UI.tab, cardDetail:UI.cardDetail, ty:UI.ty, tm:UI.tm, filter:UI.filter, vy:UI.vy, y:scrollY})); }catch(e){}
});
function revive(){ if(pageHidden && document.visibilityState==='visible'){ pageHidden=false; location.reload(); } }
addEventListener('pageshow', revive);
document.addEventListener('visibilitychange', revive);
// Put the screen back the way it was before a reload
function restoreUi(){
  let u; try{ u=JSON.parse(sessionStorage.getItem(UI_KEY)); sessionStorage.removeItem(UI_KEY); }catch(e){}
  if(!u || !tabs.includes(u.tab)) return false;
  Object.assign(UI, {ty:u.ty, tm:u.tm, filter:u.filter, vy:u.vy});
  setTab(u.tab);
  if(u.cardDetail && CARD[u.cardDetail]){ UI.cardDetail=u.cardDetail; render(); }
  window.scrollTo(0, u.y||0);
  return true;
}
showMessage('Loading…');

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err=>console.error('Service worker failed', err));
</script>
