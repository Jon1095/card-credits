<style>
/* Layout: phone-first app shell — sticky title bar, one scrolling view, fixed bottom tab bar; centered 480px column on desktop */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#eceef2; --line:#dde1e7;
  --fg:#16191f; --fg2:#4d5562; --fg3:#7a8290;
  --ink:#1d2533;            /* UI accent: ink, so the three card colors carry all the hue */
  --csr:#2f5aa8; --gold:#b07d1e; --bilt:#008f84;
  --good:#1f7a45; --good-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fbefd9;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181d; --surface:#1d2128; --sunk:#252a33; --line:#2f3540;
  --fg:#eef0f4; --fg2:#b3b9c4; --fg3:#858d9a; --ink:#e4e8ef;
  --csr:#5584d4; --gold:#bb8a2a; --bilt:#22a199;
  --good:#5cc489; --good-bg:#1c3326; --warn:#e6a447; --warn-bg:#3a2d17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1d2128; --sunk:#252a33; --line:#2f3540;
  --fg:#eef0f4; --fg2:#b3b9c4; --fg3:#858d9a; --ink:#e4e8ef;
  --csr:#5584d4; --gold:#bb8a2a; --bilt:#22a199;
  --good:#5cc489; --good-bg:#1c3326; --warn:#e6a447; --warn-bg:#3a2d17;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.sample{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--fg2);margin-bottom:14px}
.sample button{font-weight:600;color:var(--fg);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.view{display:flex;flex-direction:column;gap:18px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--fg3)}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* card art */
.cardimg{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:1.586;object-fit:cover;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px -12px rgba(0,0,0,.35)}
.cardart{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px -12px rgba(0,0,0,.35)}
.cardart::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none}
.cardart.csr{background:radial-gradient(120% 90% at 85% 10%,#3a5f9e 0%,#1b2f55 45%,#0e1a33 100%)}
.cardart.gold{background:linear-gradient(135deg,#e9c97a 0%,#c99a3e 40%,#a77a25 70%,#d8b25f 100%);color:#2a1d05}
.cardart.bilt{background:linear-gradient(135deg,#f2f4f6 0%,#b7bec6 28%,#eef1f4 52%,#9aa3ad 78%,#dfe3e8 100%);color:#161a20}
.cardart .issuer{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.cardart .cname{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.cardart .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#efd9a0,#b8944b);opacity:.9}
.cardart .net{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.cardart .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cardlist{display:flex;flex-direction:column;gap:14px}
.cardtile{display:flex;flex-direction:column;gap:8px;text-align:left}
.cardtile .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--fg2);padding-inline:4px}
.cardtile .meta b{color:var(--fg);font-weight:600}
/* generic panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 6px}
.ptitle h2,.ptitle h3{margin:0;font-size:15px;font-weight:600}
.ptitle .sub{font-size:13px;color:var(--fg3);text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--fg2)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--fg3)}
.stat .v{font-size:18px;font-weight:500}
/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.erow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px 16px}
.erow .x{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1}
.erow .d{font-size:14px;min-width:0}
.erow .d small{display:block;color:var(--fg3);font-size:12.5px}
.crow{display:flex;align-items:center;gap:8px;padding:10px 16px}
.crow .d{flex:1;min-width:0}
.crow .d .n{font-size:14.5px}
.crow .d small{display:block;color:var(--fg3);font-size:12.5px}
.crow .amt{font-size:14px;color:var(--fg2)}
.crow.off .d,.crow.off .amt{opacity:.45}
.perk{padding:10px 16px;font-size:14px}
.perk.muted{color:var(--fg3)}
.ibtn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--fg3)}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.ibtn .dotfill{fill:currentColor;stroke:currentColor}
.ibtn:hover{color:var(--fg)}
.how p{margin:0}
.how ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.perk small{display:block;color:var(--fg3);font-size:12.5px}
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;font-size:14px}
.field small{display:block;color:var(--fg3);font-size:12.5px}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
/* tracker */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar .m{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:18px}
.iconbtn:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.trow{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 8px}
.check{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%}
.check .ring{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .12s,border-color .12s}
.check .ring svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.trow.done .check .ring{background:var(--c);border-color:var(--c)}
.trow.done .check .ring svg{opacity:1}
.trow.part .check .ring{border-color:var(--c);background:conic-gradient(var(--c) var(--p),transparent 0)}
.trow .body{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px;padding-block:4px}
.trow .body .t{flex:1;min-width:0}
.trow .body .n{font-size:14.5px;line-height:1.3}
.trow.done .body .n{color:var(--fg2)}
.trow .body small{display:block;font-size:12.5px;color:var(--fg3)}
.trow .body small.soon{color:var(--warn);font-weight:600}
.trow .a{font-size:14px;text-align:right;white-space:nowrap}
.trow .a .of{color:var(--fg3)}
.prog{height:4px;border-radius:2px;background:var(--sunk);margin:2px 16px 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:2px}
.empty{padding:14px 16px;color:var(--fg3);font-size:14px}
/* guide */
.note{font-size:13.5px;color:var(--fg2);max-width:62ch}
.grow{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.grow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.grow .cat{font-weight:600;font-size:15px}
.grow .cat small{display:block;font-weight:400;color:var(--fg3);font-size:12.5px}
.winner{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));font-size:13px;font-weight:600;white-space:nowrap}
.winner .x{font-family:var(--font-num)}
.rates{display:flex;gap:6px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);background:var(--sunk);border-radius:6px;padding:3px 8px}
.rate.best{color:var(--fg);font-weight:600}
.rate.na{color:var(--fg3)}
.tip{font-size:12.5px;color:var(--fg2)}
.search{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
/* value */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .big{font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1.05}
.hero .vs{color:var(--fg2);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.vcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;text-align:left;width:100%}
.vcard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vcard .name{display:flex;align-items:center;gap:8px;font-weight:600}
.vbar{position:relative;height:12px;border-radius:6px;background:var(--sunk)}
.vbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c)}
.vbar .fee{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:1px}
.vline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg2)}
.vline b{color:var(--fg);font-weight:500}
.breakdown{border-top:1px solid var(--line);padding:6px 0}
.brow{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;font-size:13.5px}
.brow .of{color:var(--fg3)}
.brow.zero .l{color:var(--fg3)}
.chart{padding:8px 10px 12px}
.bars{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:160px;align-items:end;border-bottom:1px solid var(--line)}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.gridline span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--fg3);background:var(--surface);padding-left:4px}
.bar{position:relative;height:100%;display:flex;flex-direction:column-reverse;gap:2px;cursor:pointer;justify-content:flex-start}
.bar i{display:block;background:var(--c);width:100%}
.bar i:last-child{border-radius:4px 4px 0 0}
.bar.future{cursor:default}
.mlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:6px;font-size:10.5px;letter-spacing:-.01em;white-space:nowrap;color:var(--fg3);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);padding:0 16px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tooltip{margin:4px 16px 12px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;min-height:42px}
.tooltip .tl{display:flex;justify-content:space-between;gap:8px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;overscroll-behavior:contain;touch-action:none;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{touch-action:pan-y;overscroll-behavior:contain;width:100%;max-width:480px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet .how{font-size:14px;color:var(--fg2);background:var(--sunk);border-radius:10px;padding:10px 12px}
.amtin{display:flex;align-items:center;gap:8px;font-size:15px}
.amtin input{width:110px;font-family:var(--font-num);font-size:18px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* ---------- date helpers ---------- */
const NOW = new Date();
const pad = n=>String(n).padStart(2,'0');
const ymStr=(y,m)=>`${y}-${pad(m)}`;
const today = {y:NOW.getFullYear(), m:NOW.getMonth()+1};
const fmt = n => '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2, maximumFractionDigits:2});

function amtAt(c, y, m){
  if(!c.amts) return c.amt;
  const k=ymStr(y,m); let a=c.amts[0].amt;
  for(const h of c.amts){ if(h.from<=k) a=h.amt; }
  return a;
}
function activeAt(c,y,m){
  const k=ymStr(y,m);
  if(c.start && k<c.start) return false;
  if(c.end && k>c.end) return false;
  return true;
}
function annivMonth(c){ return (c.resetOn==='anniv' && CARD[c.card].anniv) ? S.anniv[c.card] : null; }
function periodKey(c,y,m){
  if(c.freq==='month') return ymStr(y,m);
  if(c.freq==='half') return `${y}-H${m<=6?1:2}`;
  const a=annivMonth(c);
  if(a){ const sy = m>=a ? y : y-1; return `CY${sy}-${pad(a)}`; }
  return String(y);
}
function periodEnd(c,y,m){ // date the credit resets (first day of next period)
  if(c.freq==='month') return new Date(y, m, 1);
  if(c.freq==='half') return m<=6 ? new Date(y,6,1) : new Date(y+1,0,1);
  const a=annivMonth(c);
  if(a){ const sy = m>=a ? y : y-1; return new Date(sy+1, a-1, 1); }
  return new Date(y+1,0,1);
}

/* ---------- value math ---------- */
const worth = (c, amt) => c.cash ? amt*(S.biltRate ?? 0.5) : amt;
function usedInYear(cardId, Y){
  let t=0; for(const [k,e] of Object.entries(S.log)){ const id=k.split('|')[0]; const c=CREDITS.find(x=>x.id===id); if(c&&c.card===cardId&&e.ym.startsWith(Y+'-')) t+=worth(c,e.amt); } return t;
}
function usedByCredit(c, Y){
  let t=0; for(const [k,e] of Object.entries(S.log)){ if(k.split('|')[0]===c.id && e.ym.startsWith(Y+'-')) t+=worth(c,e.amt); } return t;
}
function possibleByCredit(c, Y){
  if(!isOn(c)) return 0;
  if(c.freq==='month'){ let t=0; for(let m=1;m<=12;m++) if(activeAt(c,Y,m)) t+=amtAt(c,Y,m); return t; }
  if(c.freq==='half'){ let t=0; if(activeAt(c,Y,1)) t+=amtAt(c,Y,1); if(activeAt(c,Y,7)) t+=amtAt(c,Y,7); return t; }
  return activeAt(c,Y,12)||activeAt(c,Y,1) ? worth(c,amtAt(c,Y,12)) : 0;
}
function annualValue(cardId){ return CREDITS.filter(c=>c.card===cardId).reduce((t,c)=>t+possibleByCredit(c,today.y),0); }

/* ---------- tab 1: cards ---------- */
function renderCards(){
  if(UI.cardDetail) return renderCardDetail(CARD[UI.cardDetail]);
  view.innerHTML = `<div class="cardlist">${CARDS.map(c=>`
    <button class="cardtile" type="button" data-card="${c.id}" aria-label="${esc(c.issuer+' '+c.name)} details">
      ${art(c)}
      <div class="meta"><span>Annual fee <b class="num">${fmt(feeFor(c,today.y))}</b></span><span>Credits <b class="num">${fmt(annualValue(c.id))}</b>/yr</span></div>
    </button>`).join('')}</div>`;
  view.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>{UI.cardDetail=b.dataset.card; render(); window.scrollTo(0,0);}));
}
function renderCardDetail(c){
  const credits=CREDITS.filter(x=>x.card===c.id);
  const fee=feeFor(c,today.y), val=annualValue(c.id);
  const groups=['month','half','year'].map(f=>({f,list:credits.filter(x=>x.freq===f)})).filter(g=>g.list.length);
  const monthOpts = ['<option value="">Not set (uses Jan 1)</option>'].concat(MONTHS_L.map((n,i)=>`<option value="${i+1}" ${S.anniv[c.id]===i+1?'selected':''}>${n}</option>`)).join('');
  view.innerHTML = `
    <button class="back" type="button" id="back">‹ All cards</button>
    ${art(c)}
    <div class="statrow">
      <div class="stat"><div class="k">Annual fee</div><div class="v num">${fmt(fee)}</div></div>
      <div class="stat"><div class="k">Credits per year</div><div class="v num">${fmt(val)}</div></div>
      <div class="stat"><div class="k">Credits minus fee</div><div class="v num">${val>=fee?'+':'−'}${fmt(Math.abs(val-fee))}</div></div>
    </div>
    ${c.anniv?`<section class="panel"><div class="field"><div><label for="anniv-${c.id}">Card anniversary month</label><small>${c.id==='csr'?'The $300 travel credit resets on this date.':'Your $200 Bilt Cash arrives on this date.'}</small></div><select id="anniv-${c.id}">${monthOpts}</select></div></section>`:''}
    ${c.id==='bilt'?rentPanel():''}
    <section class="panel">
      <div class="ptitle"><h2>Statement credits</h2><span class="sub">Turn off any you won’t use</span></div>
      ${groups.map(g=>`<div class="ptitle" style="padding-top:10px"><span class="eyebrow">${FREQ[g.f]}</span></div>
        <ul class="rows">${g.list.map(x=>`<li><div class="crow ${isOn(x)?'':'off'}"><div class="d"><div class="n">${esc(x.name)}</div><small>${esc(creditSub(x))}</small></div><span class="amt num">${x.cash?'≈ ':''}${fmt(worth(x,amtAt(x,today.y,today.m)))}</span>${ibtn(x)}<button class="switch" type="button" role="switch" id="sw-${x.id}" aria-label="Track ${esc(x.name)}" aria-checked="${isOn(x)}" data-sw="${x.id}"></button></div></li>`).join('')}</ul>`).join('')}
    </section>
    <section class="panel">
      <div class="ptitle"><h2>Earn rates</h2><span class="sub">${esc(c.points)}</span></div>
      <ul class="rows">${c.earn.map(e=>`<li><div class="erow"><span class="x" style="color:${colorVar(c.id)}">${e.x}x</span><span class="d">${esc(e.t)}${e.s?`<small>${esc(e.s)}</small>`:''}</span></div></li>`).join('')}</ul>
    </section>
    <section class="panel">
      <div class="ptitle"><h2>Other benefits</h2><span class="sub">${esc(c.network)}</span></div>
      ${c.perks.map(g=>`<div class="ptitle" style="padding-top:10px"><span class="eyebrow">${esc(g.g)}</span></div>
      <ul class="rows">${g.items.map(p=>`<li><div class="perk ${p.t==='Not included'?'muted':''}">${esc(p.t)}${p.s?`<small>${esc(p.s)}</small>`:''}</div></li>`).join('')}</ul>`).join('')}
    </section>`;
  document.getElementById('back').addEventListener('click',()=>{UI.cardDetail=null; render();});
  bindInfo();
  const bsel=document.getElementById('bilt-rate');
  if(bsel) bsel.addEventListener('change',()=>{ S.biltRate=Number(bsel.value); save(); render(); toast('Bilt Cash value updated'); });
  const rin=document.getElementById('rent-in');
  if(rin) rin.addEventListener('input',()=>{ const v=parseFloat(rin.value); S.rent = v>0?v:0; save(); document.getElementById('rent-out').innerHTML=rentRows(); });
  view.querySelectorAll('[data-sw]').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.sw; if(S.off[id]) delete S.off[id]; else S.off[id]=true; save(); render(); }));
  const sel=document.getElementById('anniv-'+c.id);
  if(sel) sel.addEventListener('change',()=>{ S.anniv[c.id]= sel.value?Number(sel.value):null; save(); toast('Anniversary month saved'); });
}
/* Bilt rent math: $1 Bilt Cash = 33.33 points, so 1 point per rent dollar costs 3% of rent in Bilt Cash */
const PTS_PER_CASH = 33.33;
function rentMath(rent){ const cash=rent/PTS_PER_CASH; return {cash, spend:cash/0.04, pts:Math.round(rent), yearCash:cash*12, creditMonths:200/(cash||1)}; }
function rentTip(){ const r=rentMath(S.rent||0); return S.rent ? `1 point per dollar only when backed by Bilt Cash. Your ${fmt(S.rent)} rent needs ${fmt(Math.ceil(r.cash*100)/100)} of Bilt Cash a month, which about ${fmt(Math.ceil(r.spend))} of Palladium spend earns at 4%.` : '1 point per dollar only when backed by Bilt Cash.'; }
function rentRows(){
  const r=rentMath(S.rent||0);
  return `<div class="brow"><span class="l">Bilt Cash needed each month</span><span class="num">${fmt(Math.ceil(r.cash*100)/100)}</span></div>
    <div class="brow"><span class="l">Card spend to earn that at 4%</span><span class="num">${fmt(Math.ceil(r.spend))}</span></div>
    <div class="brow"><span class="l">Rent points unlocked each month</span><span class="num">${r.pts.toLocaleString('en-US')}</span></div>
    <div class="brow"><span class="l">Months the $200 Bilt Cash credit covers</span><span class="num">${S.rent?r.creditMonths.toFixed(1):'—'}</span></div>`;
}
function rentPanel(){
  return `<section class="panel">
    <div class="ptitle"><h2>Rent points</h2><span class="sub">$1 Bilt Cash = 33.33 points</span></div>
    <div class="field"><div><label for="rent-in">Monthly rent</label><small>Without enough Bilt Cash, rent earns nothing.</small></div>
      <div class="amtin"><span>$</span><input id="rent-in" type="number" inputmode="decimal" min="0" step="0.01" value="${S.rent||''}"></div></div>
    <div class="breakdown" id="rent-out">${rentRows()}</div>
    <div class="field" style="border-top:1px solid var(--line)"><div><label for="bilt-rate">Value of $1 Bilt Cash</label><small>33.33 points at 1¢ to 2¢ each. Used for the Value tab.</small></div>
      <select id="bilt-rate">${[[0.33,'33¢ (1¢ per point)'],[0.4,'40¢'],[0.5,'50¢ (1.5¢ per point)'],[0.6,'60¢'],[0.66,'66¢ (2¢ per point)']].map(([v,l])=>`<option value="${v}" ${(S.biltRate??0.5)===v?'selected':''}>${l}</option>`).join('')}</select></div>
  </section>`;
}
function creditSub(x){
  if(x.freq==='month') return x.end ? `Every month through ${MONTHS[Number(x.end.slice(5))-1]} ${x.end.slice(0,4)}` : 'Every month';
  if(x.freq==='half') return 'Jan–Jun and Jul–Dec';
  if(x.start && x.end && x.start.slice(0,4)===x.end.slice(0,4)) return `${x.start.slice(0,4)} only`;
  return x.resetOn==='anniv' ? 'Resets on card anniversary' : 'Resets Jan 1';
}

/* ---------- tab 2: tracker ---------- */
function renderTracker(){
  const y=UI.ty, m=UI.tm;
  const isCurrent = y===today.y && m===today.m;
  const list = CREDITS.filter(c=>isOn(c) && activeAt(c,y,m) && (UI.filter==='all'||c.card===UI.filter));
  const halfLabel = m<=6?'Jan–Jun':'Jul–Dec';
  const sections = [
    {f:'month', title:'Monthly', sub:`Resets ${fmtDate(new Date(y,m,1))}`},
    {f:'half', title:'Every six months', sub:`${halfLabel} · resets ${fmtDate(m<=6?new Date(y,6,1):new Date(y+1,0,1))}`},
    {f:'year', title:'Yearly', sub:'Each resets on its own date'}
  ];
  const atMax = ymStr(y,m) >= ymStr(today.y, today.m);
  view.innerHTML = `
    <div class="monthbar">
      <button class="iconbtn" type="button" id="prevM" aria-label="Previous month">‹</button>
      <div style="text-align:center"><div class="m">${MONTHS_L[m-1]} ${y}</div><div class="eyebrow">${isCurrent?'This month':'Logging a past month'}</div></div>
      <button class="iconbtn" type="button" id="nextM" aria-label="Next month" ${atMax?'disabled':''}>›</button>
    </div>
    <div class="chips" role="group" aria-label="Filter by card">
      <button type="button" data-f="all" aria-pressed="${UI.filter==='all'}">All cards</button>
      ${CARDS.map(c=>`<button type="button" data-f="${c.id}" aria-pressed="${UI.filter===c.id}"><span class="dot" style="background:${colorVar(c.id)}"></span>${esc(c.name)}</button>`).join('')}
    </div>
    ${sections.map(sec=>{
      const items=list.filter(c=>c.freq===sec.f);
      if(!items.length) return '';
      let used=0,total=0; items.forEach(c=>{ const a=amtAt(c,y,m); total+=worth(c,a); const e=entry(c,y,m); if(e) used+=worth(c,Math.min(e.amt,a)); });
      return `<section class="panel">
        <div class="ptitle"><h2>${sec.title}</h2><span class="sub"><span class="num">${fmt(used)}</span> of <span class="num">${fmt(total)}</span></span></div>
        <div class="ptitle" style="padding-top:0"><span class="sub" style="text-align:left">${sec.sub}</span></div>
        <div class="prog" aria-hidden="true"><i style="width:${total?Math.round(used/total*100):0}%"></i></div>
        <ul class="rows">${items.map(c=>trow(c,y,m)).join('')}</ul>
      </section>`;
    }).join('') || `<div class="panel"><div class="empty">No credits for this card this month.</div></div>`}`;
  document.getElementById('prevM').addEventListener('click',()=>{ if(--UI.tm<1){UI.tm=12;UI.ty--;} render(); });
  document.getElementById('nextM').addEventListener('click',()=>{ if(atMax) return; if(++UI.tm>12){UI.tm=1;UI.ty++;} render(); });
  view.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{UI.filter=b.dataset.f; render();}));
  view.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>toggleCredit(b.dataset.toggle)));
  view.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.open)));
  bindInfo();
}
function trow(c,y,m){
  const a=amtAt(c,y,m), e=entry(c,y,m), card=CARD[c.card];
  const done = e && e.amt>=a, part = e && e.amt<a;
  const end=periodEnd(c,y,m), days=Math.ceil((end-NOW)/86400000);
  const soon = !e && days>0 && days<=7;
  let sub = c.freq==='year' ? `${card.name} · resets ${fmtDate(end)}` : card.name;
  if(soon) sub = `${card.name} · expires in ${days} day${days===1?'':'s'}`;
  if(e && e.ym!==ymStr(y,m) && c.freq!=='month') sub = `${card.name} · used in ${MONTHS[Number(e.ym.slice(5))-1]}`;
  if(c.cash) sub = `${fmt(a)} Bilt Cash · ` + sub.replace(card.name+' · ','').replace(card.name,'resets '+fmtDate(end));
  return `<li><div class="trow ${done?'done':''} ${part?'part':''}" style="--c:${colorVar(c.card)};--p:${part?Math.round(e.amt/a*100):0}%">
    <button class="check" type="button" data-toggle="${c.id}" aria-label="${done?'Uncheck':'Check off'} ${esc(c.name)}" aria-pressed="${!!done}"><span class="ring"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span></button>
    <button class="body" type="button" data-open="${c.id}">
      <span class="t"><span class="n">${esc(c.name)}</span><small class="${soon?'soon':''}">${esc(sub)}</small></span>
      <span class="a num">${c.cash?'≈ ':''}${part?`${fmt(worth(c,e.amt))}<span class="of"> / ${fmt(worth(c,a))}</span>`:fmt(worth(c,a))}</span>
    </button>
    ${ibtn(c)}</div></li>`;
}
function logYm(){ return ymStr(UI.ty,UI.tm); }
function toggleCredit(id){
  const c=CREDITS.find(x=>x.id===id), y=UI.ty, m=UI.tm, k=`${c.id}|${periodKey(c,y,m)}`, a=amtAt(c,y,m);
  if(S.log[k] && S.log[k].amt>=a){ delete S.log[k]; }
  else { S.log[k]={amt:a, ym:logYm()}; }
  save(); render();
}

/* ---------- pop-up scroll lock ----------
   While a sheet is open the page behind it is pinned in place (body fixed at the current
   scroll offset), so swipes can only scroll the sheet. Closing restores the exact position. */
const scrim=document.getElementById('scrim');
let lockedY=0, opener=null;
function showModal(){
  if(scrim.hidden){
    opener=document.activeElement;
    lockedY=window.scrollY;
    document.body.style.top=`-${lockedY}px`;
    document.body.classList.add('locked');
  }
  scrim.hidden=false;
  const f=scrim.querySelector('.sheet'); if(f){ f.setAttribute('tabindex','-1'); f.focus({preventScroll:true}); }
}
function hideModal(){
  scrim.hidden=true; scrim.innerHTML='';
  document.body.classList.remove('locked'); document.body.style.top='';
  window.scrollTo(0,lockedY);
  if(opener && document.contains(opener)) opener.focus({preventScroll:true});
}
// iOS: block swipes on the dimmed backdrop, and stop a sheet that can't scroll further from dragging the page
scrim.addEventListener('touchmove',e=>{
  const sh=e.target.closest && e.target.closest('.sheet');
  if(!sh || sh.scrollHeight<=sh.clientHeight) e.preventDefault();
},{passive:false});

/* ---------- info button + sheet ---------- */
function ibtn(c){ return `<button class="ibtn" type="button" data-info="${c.id}" aria-label="Details for ${esc(c.name)}"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 9v5"/><circle cx="10" cy="6.2" r=".6" class="dotfill"/></svg></button>`; }
function infoBlock(c){ return `<div class="how"><p>${esc(c.how)}</p>${c.info?`<ul>${c.info.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`; }
function bindInfo(){ view.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click',()=>openInfo(b.dataset.info))); }
function openInfo(id){
  const c=CREDITS.find(x=>x.id===id), a=amtAt(c,today.y,today.m);
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="in-t">
    <div class="grab"></div>
    <div><div class="eyebrow" style="color:${colorVar(c.card)}">${esc(CARD[c.card].issuer+' '+CARD[c.card].name)} · ${FREQ[c.freq]}</div><h3 id="in-t">${esc(c.name)}</h3>
      <div class="num" style="color:var(--fg2);margin-top:2px">${fmt(a)}${c.cash?` Bilt Cash, counted as ${fmt(worth(c,a))}`:''} · ${esc(creditSub(c))}</div></div>
    ${infoBlock(c)}
    <div class="btns"><button class="btn primary" type="button" id="in-close">Done</button></div>
  </div>`;
  showModal();
  const close=hideModal;
  document.getElementById('in-close').onclick=close;
  scrim.onclick=ev=>{ if(ev.target===scrim) close(); };
}

/* ---------- partial-amount sheet ---------- */
function openSheet(id){
  const c=CREDITS.find(x=>x.id===id), y=UI.ty, m=UI.tm, k=`${c.id}|${periodKey(c,y,m)}`, a=amtAt(c,y,m), e=S.log[k];
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="grab"></div>
    <div><div class="eyebrow" style="color:${colorVar(c.card)}">${esc(CARD[c.card].issuer+' '+CARD[c.card].name)} · ${FREQ[c.freq]}</div><h3 id="sh-t">${esc(c.name)}</h3></div>
    ${infoBlock(c)}
    <div class="amtin"><label for="sh-amt">Amount used</label><input id="sh-amt" type="number" inputmode="decimal" min="0" max="${a}" step="0.01" value="${e?e.amt:''}" placeholder="0"><span class="num" style="color:var(--fg3)">of ${fmt(a)}${c.cash?' Bilt Cash':''}</span></div>
    <div class="btns"><button class="btn" type="button" id="sh-full">Used all ${fmt(a)}</button>${e?'<button class="btn" type="button" id="sh-clear">Clear</button>':''}</div>
    <div class="btns"><button class="btn" type="button" id="sh-cancel">Cancel</button><button class="btn primary" type="button" id="sh-save">Save</button></div>
  </div>`;
  showModal();
  const inp=document.getElementById('sh-amt');
  const close=hideModal;
  const commit=v=>{ if(v>0) S.log[k]={amt:Math.min(v,a), ym:e?e.ym:logYm()}; else delete S.log[k]; save(); close(); render(); };
  document.getElementById('sh-full').onclick=()=>commit(a);
  const cl=document.getElementById('sh-clear'); if(cl) cl.onclick=()=>commit(0);
  document.getElementById('sh-cancel').onclick=close;
  document.getElementById('sh-save').onclick=()=>commit(parseFloat(inp.value)||0);
  scrim.onclick=ev=>{ if(ev.target===scrim) close(); };
}

/* ---------- tab 3: best card guide ---------- */
function renderGuide(){
  const q=UI.q.trim().toLowerCase();
  const rows=GUIDE.filter(g=>!q || (g.cat+' '+(g.s||'')+' '+(g.tip||'')).toLowerCase().includes(q));
  view.innerHTML=`
    <p class="note" style="margin:0">All three cards earn transferable points, so this compares them point for point. Open a card in the Cards tab for its full earn list.</p>
    <label for="gq" class="eyebrow" style="margin-bottom:-12px">Search a category</label>
    <input class="search" id="gq" type="search" placeholder="Groceries, flights, Uber…" value="${esc(UI.q)}" autocomplete="off">
    <section class="panel"><ul class="rows" id="glist">${rows.map(grow).join('') || '<li><div class="empty">No match. “Everything else” goes on Palladium at 2x.</div></li>'}</ul></section>`;
  const gq=document.getElementById('gq');
  gq.addEventListener('input',()=>{ UI.q=gq.value; const q2=UI.q.trim().toLowerCase(); document.getElementById('glist').innerHTML = GUIDE.filter(g=>!q2||(g.cat+' '+(g.s||'')+' '+(g.tip||'')).toLowerCase().includes(q2)).map(grow).join('') || '<li><div class="empty">No match. “Everything else” goes on Palladium at 2x.</div></li>'; });
}
function grow(g){
  const ids=Object.keys(g.r).filter(k=>g.r[k]!=null);
  const best=ids.reduce((a,b)=>g.r[b]>g.r[a]?b:a, ids[0]);
  return `<li><div class="grow">
    <div class="top"><div class="cat">${esc(g.cat)}${g.s?`<small>${esc(g.s)}</small>`:''}</div>
      <span class="winner" style="--c:${colorVar(best)}"><span class="dot" style="background:${colorVar(best)}"></span>${esc(CARD[best].name)} <span class="x">${g.r[best]}x</span></span></div>
    <div class="rates">${CARDS.map(c=>{ const v=g.r[c.id]; return `<span class="rate ${c.id===best?'best':''} ${v==null?'na':''}"><span class="dot" style="background:${colorVar(c.id)}"></span>${esc(c.name)} <span class="num">${v==null?'—':v+'x'}${c.id==='bilt'&&v===2?' + 4%':''}</span></span>`; }).join('')}</div>
    ${g.rent?`<div class="tip">${esc(rentTip())}</div>`:g.tip?`<div class="tip">${esc(g.tip)}</div>`:''}
  </div></li>`;
}

/* ---------- tab 4: value ---------- */
function renderValue(){
  const Y=UI.vy;
  const per=CARDS.map(c=>{ const used=usedInYear(c.id,Y), fee=feeFor(c,Y), poss=CREDITS.filter(x=>x.card===c.id).reduce((t,x)=>t+possibleByCredit(x,Y),0); return {c,used,fee,poss}; });
  const U=per.reduce((t,p)=>t+p.used,0), F=per.reduce((t,p)=>t+p.fee,0), net=U-F;
  // monthly stacks
  const monthly=Array.from({length:12},(_,i)=>{ const ym=ymStr(Y,i+1); const by={csr:0,gold:0,bilt:0}; for(const [k,e] of Object.entries(S.log)){ if(e.ym!==ym) continue; const c=CREDITS.find(x=>x.id===k.split('|')[0]); if(c) by[c.card]+=worth(c,e.amt); } return by; });
  const mtot=monthly.map(b=>b.csr+b.gold+b.bilt);
  const rawMax=Math.max(50,...mtot);
  const step = rawMax>600?200: rawMax>300?100:50;
  const ymax=Math.ceil(rawMax/step)*step;
  const ticks=[]; for(let v=step; v<=ymax; v+=step) ticks.push(v);
  view.innerHTML=`
    <div class="monthbar">
      <button class="iconbtn" type="button" id="prevY" aria-label="Previous year">‹</button>
      <div class="hero" style="text-align:center;align-items:center">
        <span class="eyebrow">Credits redeemed in ${Y}</span>
        <span class="big num">${fmt(U)}</span>
        <span class="vs">vs <span class="num">${fmt(F)}</span> in annual fees</span>
      </div>
      <button class="iconbtn" type="button" id="nextY" aria-label="Next year" ${Y>=today.y?'disabled':''}>›</button>
    </div>
    <div style="display:flex;justify-content:center">${net>=0?`<span class="pill good">✓ Ahead by <span class="num">${fmt(net)}</span></span>`:`<span class="pill warn">▲ <span class="num">${fmt(-net)}</span> to break even</span>`}</div>
    <section class="panel">
      <div class="ptitle"><h2>By card</h2><span class="sub">Tap for each credit</span></div>
      <div class="ptitle" style="padding-top:0"><span class="sub" style="text-align:left">Bilt Cash counted at ${Math.round((S.biltRate??0.5)*100)}¢ per dollar. Change it on the Palladium card page.</span></div>
      <ul class="rows">${per.map(p=>{
        const scale=Math.max(p.fee,p.used,p.poss)||1, gap=p.used-p.fee, open=UI.open[p.c.id];
        const credits=CREDITS.filter(x=>x.card===p.c.id).map(x=>({x,u:usedByCredit(x,Y),p:possibleByCredit(x,Y)})).filter(r=>r.p>0||r.u>0).sort((a,b)=>b.u-a.u);
        return `<li><button class="vcard" type="button" data-vc="${p.c.id}" aria-expanded="${!!open}" style="--c:${colorVar(p.c.id)}">
          <div class="top"><span class="name"><span class="dot" style="background:${colorVar(p.c.id)}"></span>${esc(p.c.name)}</span>
            ${gap>=0?`<span class="pill good">✓ Ahead <span class="num">${fmt(gap)}</span></span>`:`<span class="pill warn">▲ <span class="num">${fmt(-gap)}</span> to go</span>`}</div>
          <div class="vbar" role="img" aria-label="${fmt(p.used)} used against a ${fmt(p.fee)} fee"><span class="fill" style="width:${Math.min(100,p.used/scale*100)}%"></span><span class="fee" style="left:calc(${p.fee/scale*100}% - 1px)"></span></div>
          <div class="vline"><span>Used <b class="num">${fmt(p.used)}</b></span><span>Fee <b class="num">${fmt(p.fee)}</b></span><span>Possible <b class="num">${fmt(p.poss)}</b></span></div>
        </button>
        ${open?`<div class="breakdown">${credits.map(r=>`<div class="brow ${r.u?'':'zero'}"><span class="l">${esc(r.x.name)}</span><span class="num">${fmt(r.u)}<span class="of"> / ${fmt(r.p)}</span></span></div>`).join('')}</div>`:''}
        </li>`; }).join('')}</ul>
    </section>
    <section class="panel">
      <div class="ptitle"><h2>By month</h2><span class="sub">Month each credit was used</span></div>
      <div class="legend">${CARDS.map(c=>`<span><span class="dot" style="background:${colorVar(c.id)}"></span>${esc(c.name)}</span>`).join('')}</div>
      <div class="chart">
        <div class="bars" id="bars">
          ${ticks.map(v=>`<div class="gridline" style="bottom:${v/ymax*100}%"><span class="num">$${v}</span></div>`).join('')}
          ${monthly.map((b,i)=>{ const future = Y===today.y && i+1>today.m; const segs=CARDS.map(c=>b[c.id]>0?`<i style="--c:${colorVar(c.id)};height:calc(${b[c.id]/ymax*100}% - 2px)"></i>`:'').join('');
            return `<button class="bar ${future?'future':''}" type="button" data-m="${i}" aria-label="${MONTHS_L[i]}: ${fmt(mtot[i])}">${segs}</button>`; }).join('')}
        </div>
        <div class="mlabels" aria-hidden="true">${MONTHS.map(m=>`<span>${m}</span>`).join('')}</div>
      </div>
      <div class="tooltip" id="tip">${tipHtml(UI.month ?? (Y===today.y?today.m-1:11), monthly, mtot)}</div>
    </section>`;
  document.getElementById('prevY').onclick=()=>{UI.vy--; UI.month=null; render();};
  document.getElementById('nextY').onclick=()=>{ if(UI.vy<today.y){UI.vy++; UI.month=null; render();} };
  view.querySelectorAll('[data-vc]').forEach(b=>b.addEventListener('click',()=>{ UI.open[b.dataset.vc]=!UI.open[b.dataset.vc]; render(); }));
  const tip=document.getElementById('tip');
  view.querySelectorAll('[data-m]').forEach(b=>{
    const show=()=>{ UI.month=Number(b.dataset.m); tip.innerHTML=tipHtml(UI.month,monthly,mtot); };
    b.addEventListener('mouseenter',show); b.addEventListener('focus',show); b.addEventListener('click',show);
  });
}
function tipHtml(i,monthly,mtot){
  const b=monthly[i];
  return `<div class="tl"><b>${MONTHS_L[i]}</b><b class="num">${fmt(mtot[i])}</b></div>` +
    CARDS.filter(c=>b[c.id]>0).map(c=>`<div class="tl"><span style="display:inline-flex;gap:6px;align-items:center"><span class="dot" style="background:${colorVar(c.id)}"></span>${esc(c.name)}</span><span class="num">${fmt(b[c.id])}</span></div>`).join('') +
    (mtot[i]===0?`<div style="color:var(--fg3)">Nothing logged.</div>`:'');
}

/* ---------- misc ---------- */
let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !scrim.hidden) hideModal(); });

const start = (location.hash||'').slice(1);
setTab(tabs.includes(start)?start:'tracker');
</script>
